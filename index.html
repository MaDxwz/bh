<!DOCTYPE html>

<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(#ffe6f0, #fff0f5);
    overflow-x: hidden;
    text-align: center;
  }

  h1 {
    font-size: 4em;
    margin-top: 50px;
    color: #ff3366;
    animation: bounce 1s ease infinite alternate, colorChange 3s ease infinite alternate;
  }

  @keyframes bounce {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-30px); }
  }

  @keyframes colorChange {
    0% { color: #ff3366; }
    50% { color: #ff99cc; }
    100% { color: #ff3366; }
  }

  .cake {
    margin: 30px auto;
    width: 220px;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 2s, transform 2s;
  }

  button {
    padding: 12px 25px;
    font-size: 1.2em;
    margin: 20px;
    cursor: pointer;
    background-color: #ff6699;
    border: none;
    border-radius: 15px;
    color: white;
    box-shadow: 0 5px #cc3366;
  }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 3px #cc3366;
  }

  #surpriseButton {
    padding: 20px 40px;
    font-size: 2em;
    background-color: #ff0000;
    color: white;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 5px #cc0000;
    margin: 20px;
  }

  #surpriseButton:active {
    transform: translateY(2px);
    box-shadow: 0 3px #cc0000;
  }

  .timeline {
    margin: 50px auto;
    max-width: 900px;
    text-align: center;
  }

  .gift {
    display: inline-block;
    font-size: 3em;
    cursor: pointer;
    margin: 50px 50px;
    transition: transform 0.3s;
  }

  .gift:hover { transform: scale(1.5) rotate(10deg); }

  .memory {
    display: none;
    margin: 20px 0;
    text-align: center;
  }

  .caption {
    font-size: 1.2em;
    color: #333;
    margin-bottom: 30px;
  }

  .balloon {
    position: absolute;
    bottom: -100px;
    font-size: 2.5em;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-1200px); }
  }

  canvas { position: fixed; top: 0; left: 0; pointer-events: none; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  // Confetti bursts
  function shootConfetti() {
    for(let i=0;i<3;i++){
      confetti({
        particleCount: 100,
        spread: 120,
        origin: { x: Math.random(), y: Math.random() * 0.6 },
        colors: ['#ff3366','#ff99cc','#ffccff','#ff6699','#cc3366']
      });
    }
  }

  // Balloons
  function createBalloon() {
    const balloon = document.createElement('div');
    balloon.className = 'balloon';
    balloon.style.left = Math.random() * window.innerWidth + 'px';
    balloon.style.animationDuration = (5 + Math.random() * 5) + 's';
    const colors = ['🎈','🎉','🎊','💖','🎀'];
    balloon.innerText = colors[Math.floor(Math.random()*colors.length)];
    document.body.appendChild(balloon);
    setTimeout(() => { balloon.remove(); }, 12000);
  }

  window.onload = () => {
    shootConfetti();
    document.getElementById('cake').style.opacity = 1;
    document.getElementById('cake').style.transform = 'scale(1)';
    for(let i=0;i<30;i++){
      setTimeout(createBalloon, i*300);
    }
    setInterval(shootConfetti, 3000);
    setInterval(createBalloon, 1000);
  };

  // Play birthday tune
  function playBirthdaySong() {
    document.getElementById('birthdaySong').play();
  }

  // Play surprise sound
  document.getElementById('surpriseButton').addEventListener('click', () => {
    document.getElementById('surpriseSound').play();
  });

  // Open gift with confetti
  function openGift(element) {
    const memory = element.nextElementSibling;
    memory.style.display = 'block';
    element.style.display = 'none';
    shootConfetti();
  }
</script>
